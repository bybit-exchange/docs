openapi: 3.0.0
servers:
  - url: https://api-testnet.bybit.com
    description: Testnet server
info:
  description: |
    Collection of v5 Restul API
  version: 3.0.0
  title: Bybit Open API v5 explorer - Spot margin trade
tags:
  - name: uta-margin-trade
    description: Spot margin trade (UTA) endpoints
    x-displayName: Spot Margin Trade (UTA)
x-tagGroups:
  - name: private
    tags:
      - uta-margin-trade
paths:
  /v5/spot-margin-trade/data:
    get:
      tags:
        - uta-margin-trade
      summary: Get VIP Margin Data
      description: Get vip margin data
      operationId: vip-margin
      parameters:
        - name: vipLevel
          in: query
          description: VIP level
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - No VIP
                - VIP-1
                - VIP-2
                - VIP-3
                - VIP-4
                - VIP-5
                - PRO-1
                - PRO-2
                - PRO-3
                - PRO-4
                - PRO-5
        - name: currency
          in: query
          description: Coin name
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
  /v5/spot-margin-trade/switch-mode:
    post:
      tags:
        - uta-margin-trade
      summary: Toggle Margin Trade
      description: Toggle margin trade
      operationId: switch-mode
      parameters:
        - name: apiKey
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
        - name: secret
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                spotMarginMode:
                  type: integer
                  description: Margin mode. 0=off, 1=on
                  enum:
                    - 0
                    - 1
                  example: 0
                required:
                  - spotMarginMode
  /v5/spot-margin-trade/set-leverage:
    post:
      tags:
        - uta-margin-trade
      summary: Set Leverage
      description: Set leverage for margin trade
      operationId: set-leverage
      parameters:
        - name: apiKey
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
        - name: secret
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                leverage:
                  type: integer
                  description: Levearge, support 2-10
                  enum:
                    - 2
                    - 3
                    - 4
                    - 5
                    - 6
                    - 7
                    - 8
                    - 9
                    - 10
                  example: 5
                required:
                  - leverage
  /v5/spot-margin-trade/state:
    get:
      tags:
        - uta-margin-trade
      summary: Get Status And Leverage
      description: Get status and leverage
      operationId: status
      parameters:
        - name: apiKey
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
        - name: secret
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
  /v5/spot-margin-trade/fixedborrow-interest-accrued:
    get:
      tags:
        - uta-margin-trade
      summary: Query Fixed-Rate Borrow Penalty Interest
      description: Query fixed-rate borrow penalty interest records. Results are returned in descending order by record creation time, then record ID.
      operationId: fixedborrow-interest-accrued
      parameters:
        - name: apiKey
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
        - name: secret
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
        - name: orderId
          in: query
          description: Fixed-rate borrow order ID
          required: false
          schema:
            type: string
        - name: orderCurrency
          in: query
          description: Borrow coin name
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: "Limit for data size per page. [1, 100]. Default: 10"
          required: false
          schema:
            type: string
            default: "10"
        - name: cursor
          in: query
          description: Cursor. Use the nextPageCursor token from the response to retrieve the next page.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
  /v5/spot-margin-trade/fixedborrow-order-cancel:
    post:
      tags:
        - uta-margin-trade
      summary: Cancel Fixed-Rate Borrow Order
      description: Request cancellation of an eligible fixed-rate borrow order. Query the order later to confirm its final status.
      operationId: fixedborrow-order-cancel
      parameters:
        - name: apiKey
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
        - name: secret
          in: header
          description: A UTA sub account API key is provided by default
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: string
                  minLength: 1
                  description: Fixed-rate borrow order ID
                  example: FIXED_BORROW_example
      responses:
        "200":
          description: successful operation
  /v5/spot-margin-trade/get-trade-auto-repay:
    get:
      tags:
        - uta-margin-trade
      summary: Get Trade Auto Repay
      description: Retrieve the authenticated Unified account's trade auto repayment switch. The saved setting takes effect only in Cross and Portfolio margin modes; it has no effect in Isolated mode. This switch is separate from the scheduled auto repayment settings returned by `get-auto-repay-mode`.
      operationId: getTradeAutoRepay
      security:
        - ApiKeyAuth: []
          ApiSignAuth: []
          ApiTimestampAuth: []
          ApiRecvWindowAuth: []
      responses:
        "200":
          description: Request accepted; a non-zero `retCode` indicates a business error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTradeAutoRepayResponse"
              examples:
                enabled:
                  summary: Trade auto repayment enabled
                  value:
                    retCode: 0
                    retMsg: success
                    result:
                      autoRepay: "1"
                    retExtInfo: {}
                    time: 1792117143000
        "400":
          description: Invalid HTTP request or parameter format.
        "401":
          description: API authentication failed.
        "403":
          description: API key lacks read permission or the request is restricted.
        "404":
          description: Endpoint not found.
        "429":
          description: Rate limit exceeded.
  /v5/spot-margin-trade/set-trade-auto-repay:
    post:
      tags:
        - uta-margin-trade
      summary: Set Trade Auto Repay
      description: Enable or disable automatic repayment after an eligible spot trade credits a coin to the Unified account. The credited coin can repay its own flexible-rate liability without asset conversion. Trade auto repayment runs only in Cross and Portfolio margin modes; the setting has no effect in Isolated mode. This setting is separate from scheduled auto repayment configured through `set-auto-repay-mode`, and is disabled by default.
      operationId: setTradeAutoRepay
      security:
        - ApiKeyAuth: []
          ApiSignAuth: []
          ApiTimestampAuth: []
          ApiRecvWindowAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTradeAutoRepayRequest"
            examples:
              enable:
                summary: Enable trade auto repayment
                value:
                  autoRepay: "1"
              disable:
                summary: Disable trade auto repayment
                value:
                  autoRepay: "0"
      responses:
        "200":
          description: Request accepted; a non-zero `retCode` indicates a business error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetTradeAutoRepayResponse"
              examples:
                enabled:
                  summary: Trade auto repayment enabled
                  value:
                    retCode: 0
                    retMsg: success
                    result:
                      autoRepay: "1"
                    retExtInfo: {}
                    time: 1792117143000
        "400":
          description: Invalid HTTP request or parameter format.
        "401":
          description: API authentication failed.
        "403":
          description: API key lacks write permission or the request is restricted.
        "404":
          description: Endpoint not found.
        "429":
          description: Rate limit exceeded.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-BAPI-API-KEY
    ApiSignAuth:
      type: apiKey
      in: header
      name: X-BAPI-SIGN
    ApiTimestampAuth:
      type: apiKey
      in: header
      name: X-BAPI-TIMESTAMP
    ApiRecvWindowAuth:
      type: apiKey
      in: header
      name: X-BAPI-RECV-WINDOW
      description: Request validity window in milliseconds; the API defaults to 5000.
  schemas:
    SetTradeAutoRepayRequest:
      type: object
      required:
        - autoRepay
      properties:
        autoRepay:
          type: string
          pattern: "^[01]$"
          description: '"1" enables trade auto repayment; "0" disables it.'
          example: "1"
    SetTradeAutoRepayResponse:
      type: object
      properties:
        retCode:
          type: integer
          description: Business return code. 0 means success; 34022101 means invalid autoRepay.
          example: 0
        retMsg:
          type: string
          description: Business return message.
          example: success
        result:
          type: object
          properties:
            autoRepay:
              type: string
              pattern: "^[01]$"
              description: Saved switch state; "1" means enabled and "0" means disabled.
              example: "1"
        retExtInfo:
          type: object
          description: Extended return information.
        time:
          type: integer
          format: int64
          description: Server timestamp in milliseconds.
          example: 1792117143000
    GetTradeAutoRepayResponse:
      type: object
      properties:
        retCode:
          type: integer
          description: Business return code. 0 means success.
          example: 0
        retMsg:
          type: string
          description: Business return message.
          example: success
        result:
          type: object
          properties:
            autoRepay:
              type: string
              pattern: "^[01]$"
              description: Saved switch state; "1" means enabled and "0" means disabled.
              example: "1"
        retExtInfo:
          type: object
          description: Extended return information.
        time:
          type: integer
          format: int64
          description: Server timestamp in milliseconds.
          example: 1792117143000
